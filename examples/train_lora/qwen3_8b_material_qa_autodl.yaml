### model
model_name_or_path: /root/autodl-tmp/models/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: "[Easy Dataset] [wpFuh_5cOk4Y] Alpaca"
dataset_dir: test/wpFuh_5cOk4Y
template: qwen3
enable_thinking: false
cutoff_len: 1536
val_size: 0.0
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: saves/qwen3-8b/lora/material-qa
logging_steps: 1
eval_strategy: "no"
save_strategy: epoch
save_total_limit: 1
plot_loss: true
overwrite_output_dir: true
load_best_model_at_end: false
report_to: wandb
run_name: qwen3-8b-material-qa-lora-1epoch

### train
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null
